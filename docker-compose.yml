services:
  bot:
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YTDLP_COOKIES_FILE: /run/secrets/reddit-cookies.txt
      INSTAGRAM_COOKIES_FILE: /run/secrets/instagram-cookies.txt
    volumes:
      - bot-logs:/app/logs
      - ./reddit-cookies.txt:/run/secrets/reddit-cookies.txt:ro
      - ./instagram-cookies.txt:/run/secrets/instagram-cookies.txt:ro

volumes:
  bot-logs:
